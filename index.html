t-variant-numeric:tabular-nums}.field{min-width:0;width:100%;background:#101520;border:1px solid #303b51;border-radius:10px;color:#f7faff;padding:10px 7px;text-align:center;font-size:14px;font-weight:750;appearance:textfield}.field::-webkit-inner-spin-button,.field::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.setrow.done .field{background:#1d3323;border-color:#496f49}.tick{width:35px;height:35px;display:grid;place-items:center;background:#202a39;border:1px solid #3a4559;border-radius:10px;color:transparent;margin:auto;font-weight:900;font-size:16px}.tick.checked{background:var(--accent);color:#182113;border-color:var(--accent)}.exfoot{display:flex;align-items:center;justify-content:space-between;margin-top:3px;gap:9px}.exfoot .btn{padding:7px 10px;font-size:11px}.footeraction{padding:18px;display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:14px}.footeraction p{font-size:12px;color:var(--muted);margin:2px 0 0}.footeraction .btn{padding:14px 18px}.historylist{display:grid;gap:11px}.historyitem{padding:19px}.historyitem summary{list-style:none;cursor:pointer}.historyitem summary::-webkit-details-marker{display:none}.historyitem summary .row{display:flex;justify-content:space-between;gap:12px;align-items:center}.historyitem .title{font-size:17px;font-weight:800}.historyitem .detail{color:var(--muted);font-size:12px;margin-top:4px}.historyexpand{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}.historyexpand table{width:100%;border-collapse:collapse;font-size:12px}.historyexpand td{padding:7px 5px;border-bottom:1px solid #303849}.historyexpand td:last-child{text-align:right;color:var(--muted)}.empty{text-align:center;padding:45px 23px;color:var(--muted);border:1px dashed #3b455a;border-radius:17px}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.metric{padding:21px}.metric .value{font-size:31px;font-weight:900;letter-spacing:-.05em}.metric .caption{font-size:12px;color:var(--muted)}.charts{padding:20px;margin-bottom:15px}.chartrow{display:flex;align-items:center;gap:10px;margin-top:13px}.chartlabel{color:#cdd7e7;font-size:11px;width:80px;white-space:nowrap}.charttrack{flex:1;background:#2b3445;height:13px;border-radius:5px;overflow:hidden}.chartfill{height:100%;border-radius:5px;background:var(--accent)}.chartvalue{font-size:11px;text-align:right;width:52px;color:#bac7d8}.prgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.pr{padding:16px}.pr strong{font-size:21px;display:block;margin-top:5px}.pr .exmeta{margin-top:0}.settings{padding:22px;display:grid;gap:14px}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:14px}.settingrow:last-child{border:none;padding-bottom:0}.settingrow h3{font-size:14px;margin:0 0 5px}.settingrow p{color:var(--muted);font-size:12px;margin:0;max-width:520px}.restpill{position:fixed;bottom:18px;right:18px;z-index:10;background:#d2f8a5;color:#162211;box-shadow:0 10px 40px #0007;border-radius:15px;padding:12px 15px;display:flex;align-items:center;gap:14px;font-size:13px;font-weight:800}.restpill button{color:#253322;background:#ffffff85;border:0;border-radius:8px;padding:5px 9px}.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-60px);opacity:0;transition:.2s;pointer-events:none;background:#f4f8ea;color:#18251c;padding:11px 18px;border-radius:11px;z-index:100;font-weight:750;box-shadow:0 12px 25px #0008;max-width:90vw;text-align:center}.toast.visible{transform:translateX(-50%) translateY(0);opacity:1}.notes{resize:vertical;min-height:65px;width:100%;background:#101520;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:13px}.noteslabel{font-size:12px;font-weight:750;display:block;margin:12px 0 6px}.lightcaption{font-size:11px;color:var(--muted);line-height:1.55}.smallfooter{text-al @media(max-width:780px){.maincolumns{grid-template-columns:minmax(0,1fr)}.side{grid-template-columns:repeat(2,1fr)}.side .panel:last-child{grid-column:span 2}.heroDecor{display:none}.top{margin-bottom:22px}.workoutgrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:20px 14px 110px}}

<body>
<div id="app"></div><div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='rep-workout-tracker-v1';
const TEMPLATES=[
{id:'upper-a',day:'SUN',dayLong:'Sunday',name:'Upper A',focus:'Chest + back',duration:'65–75 min',ex:[['pullups','Pull-ups',3,'6–10',7.5,'added kg'],['incline','Incline press',3,'6–10',27.5],['row','Seated rows',2,'8–12',60],['flies','Chest flies',2,'10–15',60],['lateral','Lateral raises',2,'12–20',10],['pushdown','Tricep pushdowns',2,'10–15',30],['preacher','Preacher curls',2,'10–15',10]]},
{id:'lower-a',day:'TUE',dayLong:'Tuesday',name:'Lower A',focus:'Quad emphasis',duration:'55–65 min',ex:[['legpress','Leg press',3,'8–12',150],['legcurl','Leg curls',3,'10–15',57],['legext','Leg extensions',2,'10–15',98],['calves','Calf raises',3,'10–20',103],['legraise','Leg raises',2,'10–20',0,'bodyweight']]},
{id:'upper-b',day:'THU',dayLong:'Thursday',name:'Upper B',focus:'Shoulders + back',duration:'65–75 min',ex:[['dips','Chest dips',3,'6–10',15,'added kg'],['row','Seated rows',3,'8–12',60],['shoulder','Shoulder press',2,'8–12',22.5],['pullover','Pullover',2,'10–15',40],['reardelt','Rear delts',2,'12–20',10],['overhead','Overhead tricep extensions',2,'10–15',30],['seatedcurl','Seated curls',2,'10–15',12.5]]},
{id:'lower-b',day:'FRI',dayLong:'Friday',name:'Lower B',focus:'Hamstring emphasis',duration:'55–65 min',ex:[['rdl','Romanian deadlift',3,'6–10',80],['legpress','Leg press',2,'8–12',150],['legcurl','Leg curls',2,'10–15',57],['legext','Leg extensions',2,'10–15',98],['calves','Calf raises',2,'10–20',103],['legraise','Leg raises',2,'10–20',0,'bodyweight']]}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weightFmt=n=>Number.isFinite(Number(n))?Number(n).toLocaleString('en-US',{maximumFractionDigits:2}):'—';
const durationString=ms=>{let sec=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`};
const defaultState=()=>({selected:pickToday(),tab:'workout',drafts:{},history:[],restEnd:0});
function pickToday(){return ({0:'upper-a',2:'lower-a',4:'upper-b',5:'lower-b'})[new Date().getDay()]||'upper-a'}
function load(){try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&typeof data==='object'&&Array.isArray(data.history)&&data.drafts&&typeof data.drafts==='object')return {...defaultState(),...data,tab:'workout'};}catch(e){}return defaultState()}
let state=load();let toastHandle;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Local saving may be blocked — use Export backup') }}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('visible'),3000)}
function template(){return TEMPLATES.find(t=>t.id===state.selected)||TEMPLATES[0]}
function lastWeight(exId, fallback){for(const session of [...state.history].reverse()){const ex=(session.exercises||[]).find(x=>x.id===exId);if(ex){const s=(ex.sets||[]).find(z=>z.done&&z.weight!==''&&Number.isFinite(Number(z.weight)));if(s)return Number(s.weight)}}return fallback}
function newDraft(t){return {started:Date.now(),notes:'',exercises:t.ex.map(([id,name,count,target,weight,unit])=>({id,name,target,unit:unit||'kg',sets:Array.from({length:count},()=>({weight:lastWeight(id,weight),reps:'',done:false}))}))}}
function draft(){const t=template();if(!state.drafts[t.id]){state.drafts[t.id]=newDraft(t);save()}return state.drafts[t.id]}
function statsOf(d){let count=0,total=0,volume=0,all=0;for(const ex of d.exercises){all+=ex.sets.length;for(const set of ex.sets){if(set.done){count++;volume+=(Number(set.weight)||0)*(Number(set.reps)||0)}total++;}}return {count,total,volume,all,pct:all?Math.round(count/all*100):0}}
function icon(name){return {workout:'◫',history:'↺',progress:'▥',settings:'⚙'}[name]||'•'}
function shell(content){const date=new Intl.DateTimeFormat('en-IL',{month:'short',day:'numeric',weekday:'short'}).format(new Date());document.getElementById('app').innerHTML=`<div class="wrap"><header class="top"><div class="brand"><span class="brandicon">R</span><span>REP<em>.</em></span></div><div class="topright"><span class="topdate">${esc(date)}</span><span class="chip">4-DAY SPLIT</span></div></header><div class="headline"><div><div class="eyebrow">YOUR TRAINING SPACE</div><h1>Stronger, <span style="color:var(--accent)">set by set.</span></h1><p>Show up, lift smart, log your progress. No spreadsheets required.</p></div><div class="heroDecor">↗</div></div><nav class="nav" aria-label="Main navigation">${[['workout','Workout'],['history','History'],['progress','Progress'],['settings','Settings']].map(([id,label])=>`<button type="button" class="${state.tab===id?'active':''}" data-act="tab" data-tab="${id}"><span>${icon(id)}</span> ${label}</button>`).join('')}</nav>${content}<div class="smallfooter">REP. • Your data stays on this device unless you export it.</div></div><div id="restbar"></div>`;updateRestBar()}
function renderWorkout(){const t=template(),d=draft(),s=statsOf(d);const switcher=`<div class="sectiontitle"><h2>Your split</h2><span class="micro">Choose a training day</span></div><div class="workoutgrid">${TEMPLATES.map(x=>`<button class="daybutton ${x.id===t.id?'active':''}" data-act="select" data-id="${x.id}"><span class="dow">${x.day} · ${esc(x.duration)}</span><span class="dname">${x.name}</span><span class="dspec">${esc(x.focus)}</span></button>`).join('')}</div>`;
const exercises=d.exercises.map((ex,ei)=>`<article class="panel exercise"><div class="exhead"><span class="exnum ${ex.sets.every(set=>set.done)&&ex.sets.length?'complete':''}">${String(ei+1).padStart(2,'0')}</span><div class="exinfo"><div class="exname">${esc(ex.name)}</div><div class="exmeta">${esc(ex.target)} reps · ${ex.unit==='added kg'?'External load (+kg)':ex.unit==='bodyweight'?'Bodyweight / optional load':'Weight in kg'}</div></div><button class="iconbutton" data-act="remove-ex" data-ex="${ei}" title="Remove from this session" aria-label="Remove exercise">✕</button></div><div class="settable sethead"><span>Set</span><span>Rep goal</span><span>${ex.unit==='added kg'?'+KG':'KG'}</span><span>Reps</span><span>Done</span></div>${ex.sets.map((set,si)=>`<div class="settable setrow ${set.done?'done':''}"><span class="setlabel">${si+1}</span><span class="last">${esc(ex.target)} reps</span><input class="field" inputmode="decimal" type="number" step="0.5" min="0" data-act="input" data-ex="${ei}" data-set="${si}" data-field="weight" aria-label="${esc(ex.name)} set ${si+1} weight" value="${esc(set.weight)}"><input class="field" type="number" inputmode="numeric" min="1" max="100" step="1" data-act="input" data-ex="${ei}" data-set="${si}" data-field="reps" aria-label="${esc(ex.name)} set ${si+1} reps" value="${esc(set.reps)}"><button class="tick ${set.done?'checked':''}" data-act="toggle" data-ex="${ei}" data-set="${si}" aria-label="${set.done?'Unmark':'Complete'} ${esc(ex.name)} set ${si+1}">✓</button></div>`).join('')}<div class="exfoot"><button class="btn tiny ghost" data-act="add-set" data-ex="${ei}">+ Add set</button><button class="btn tiny ghost" data-act="remove-set" data-ex="${ei}" ${ex.sets.length<=1?'disabled':''}>− Remove set</button></div></article>`).join('');
const overview=`<div class="panel overview"><span class="tag">${esc(t.dayLong)} · ${esc(t.focus)}</span><h2>${esc(t.name)} <span style="color:var(--accent)">/ Log</span></h2><p>Target ${esc(t.duration)} · Aim for 1–3 reps in reserve on most sets</p><div class="progressrow"><strong>${s.count} / ${s.all} sets completed</strong><strong>${s.pct}%</strong></div><div class="bar"><div class="barfill" style="width:${s.pct}%"></div></div></div>`;
const side=`<aside class="side"><div class="panel"><h3>Sets completed</h3><div class="statnumber">${s.count}<span style="font-size:16px;color:var(--muted)"> / ${s.all}</span></div><div class="subtext">Every rep counts.</div></div><div class="panel"><h3>External volume</h3><div class="statnumber">${Math.round(s.volume).toLocaleString()}</div><div class="subtext">kg × reps logged*</div></div><div class="panel"><h3>Rest timer</h3><div class="restbuttons"><button class="btn" data-act="rest" data-sec="90">1:30</button><button class="btn" data-act="rest" data-sec="150">2:30</button></div><div class="hint">*Bodyweight not included in volume. Weighted pull-ups and dips count added load only.</div></div></aside>`;
const footer=`<div class="panel footeraction"><div><strong>Ready to finish?</strong><p>Only checked-off sets go into history.</p></div><button class="btn primary" data-act="finish" ${s.count===0?'disabled':''}>Finish workout →</button></div>`;
shell(switcher+`<div class="maincolumns"><main>${overview}<div class="sectiontitle"><h2>Exercises</h2><span class="micro">${d.exercises.length} movements</span></div><div class="exercises">${exercises}</div><button class="btn ghost" style="width:100%;margin-top:12px" data-act="add-ex">+ Add custom exercise</button><label class="noteslabel" for="notes">Workout notes</label><textarea id="notes" class="notes" placeholder="Energy, soreness, machine substitutions...">${esc(d.notes)}</textarea>${footer}</main>${side}</div>`)}
function dateLabel(ts){return new Intl.DateTimeFormat('en-IL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}
function renderHistory(){const entries=[...state.history].reverse();shell(`<div class="sectiontitle"><h2>Workout history</h2><span class="micro">${entries.length} completed sessions</span></div>${entries.length?`<div class="historylist">${entries.map(s=>`<details class="panel historyitem"><summary><div class="row"><div><div class="title">${esc(s.name)}</div><div class="detail">${esc(dateLabel(s.ended))} · ${s.setCount} sets</div></div><span style="color:var(--accent);font-size:20px">⌄</span></div></summary><div class="historyexpand"><table>${s.exercises.map(ex=>`<tr><td><strong>${esc(ex.name)}</strong></td><td>${ex.sets.map(z=>`${weightFmt(z.weight)} kg × ${esc(z.reps)}`).join(' · ')}</td></tr>`).join('')}</table>${s.notes?`<p class="subtext" style="margin:14px 0 0"><strong>Notes:</strong> ${esc(s.notes)}</p>`:''}<div class="subtext" style="margin-top:12px">Logged external volume: ${Math.round(s.volume).toLocaleString()} kg-reps</div><button class="btn tiny danger" style="margin-top:14px" data-act="delete-history" data-id="${esc(s.id)}">Delete this session</button></div></details>`).join('')}</div>`:`<div class="empty"><strong>No workouts logged yet.</strong>Finish your first session and it’ll appear here.</div>`}`)}
function renderProgress(){const entries=state.history;const allSets=entries.reduce((a,b)=>a+b.setCount,0);const totalVolume=entries.reduce((a,b)=>a+b.volume,0);const data=entries.slice(-8);const mx=Math.max(1,...data.map(s=>s.volume));const best={};for(const s of entries)for(const ex of s.exercises)for(const set of ex.sets){const weight=Number(set.weight);if(Number.isFinite(weight)&&weight>0&&(!best[ex.id]||best[ex.id].weight<weight))best[ex.id]={name:ex.name,weight,reps:set.reps,unit:ex.unit}};shell(`<div class="sectiontitle"><h2>Progress</h2><span class="micro">Built one session at a time</span></div><div class="metrics"><div class="panel metric"><div class="value">${entries.length}</div><div class="caption">Workouts logged</div></div><div class="panel metric"><div class="value">${allSets}</div><div class="caption">Completed sets</div></div><div class="panel metric"><div class="value">${totalVolume>=1000?(totalVolume/1000).toFixed(1)+'k':Math.round(totalVolume)}</div><div class="caption">kg-reps volume*</div></div></div><div class="panel charts"><div class="sectiontitle"><h2>Last ${data.length} sessions</h2><span class="micro">External volume</span></div>${data.length?data.map(s=>`<div class="chartrow"><span class="chartlabel">${esc(s.name)}</span><div class="charttrack"><div class="chartfill" style="width:${Math.max(2,Math.round(s.volume/mx*100))}%"></div></div><span class="chartvalue">${Math.round(s.volume).toLocaleString()}</span></div>`).join(''):`<div class="empty"><strong>Your progress starts here.</strong>Log a workout to see your trends.</div>`}<p class="lightcaption">*Volume = logged external weight × reps. Comparing Upper and Lower days directly isn't meaningful; check similar sessions over time.</p></div><div class="sectiontitle"><h2>Heaviest loads logged</h2><span class="micro">Not necessarily 1-rep maxes</span></div>${Object.keys(best).length?`<div class="prgrid">${Object.values(best).sort((a,b)=>b.weight-a.weight).map(ex=>`<div class="panel pr"><div class="exmeta">${esc(ex.name)}</div><strong>${weightFmt(ex.weight)} ${ex.unit==='added kg'?'+kg':'kg'}</strong><div class="subtext">For ${esc(ex.reps)} reps</div></div>`).join('')}</div>`:`<div class="empty"><strong>No weight records yet.</strong>Completed sets will show here.</div>`}`)}
function renderSettings(){shell(`<div class="sectiontitle"><h2>Your data</h2><span class="micro">Simple, private and portable</span></div><div class="panel settings"><div class="settingrow"><div><h3>Export backup</h3><p>Download your workout history and in-progress sessions as JSON. Do this regularly if you rely on this tracker.</p></div><button class="btn primary" data-act="export">Export</button></div><div class="settingrow"><div><h3>Import backup</h3><p>Restore a JSON file previously exported from this app. Replaces existing local data.</p></div><div><button class="btn" data-act="import-click">Import</button><input class="upload" type="file" accept="application/json,.json" id="importfile"></div></div><div class="settingrow"><div><h3>Reset all data</h3><p>Delete all local sessions and drafts from this browser. Cannot be undone without a backup.</p></div><button class="btn danger" data-act="reset">Reset</button></div></div><div class="panel settings" style="margin-top:14px"><h3 style="margin:0">About your training split</h3><p class="subtext" style="margin:0">Sunday Upper A · Tuesday Lower A · Thursday Upper B · Friday Lower B. The suggested starting weights are based on your previous routine; change them to match your current strength and your gym's machines. When you complete a workout, logged weights automatically carry into future sessions.</p><p class="subtext" style="margin:0">This app stores information only in this browser using local storage. Clearing browser data, using private mode, or changing browsers/devices may erase or hide it. Your data does not sync automatically.</p></div>`)}
function render(){if(!['workout','history','progress','settings'].includes(state.tab))state.tab='workout';({workout:renderWorkout,history:renderHistory,progress:renderProgress,settings:renderSettings}[state.tab])()}
function updateRestBar(){const el=document.getElementById('restbar');if(!el)return;const rem=state.restEnd-Date.now();if(rem<=0){if(el.innerHTML){el.innerHTML='';if(state.restEnd){state.restEnd=0;save();notify('Rest is over — ready for your next set!')}}return;}const txt=durationString(rem);if(el.querySelector('#restcount'))el.querySelector('#restcount').textContent=txt;else el.innerHTML=`<div class="restpill"><span>⏱ Rest <span id="restcount">${txt}</span></span><button data-act="stop-rest">Stop</button></div>`}
function handleAction(el){const act=el.dataset.act;
if(act==='tab'){state.tab=el.dataset.tab;save();render();window.scrollTo({top:0,behavior:'smooth'})}
else if(act==='select'){state.selected=el.dataset.id;save();render()}
else if(act==='toggle'){const d=draft(),set=d.exercises[+el.dataset.ex]?.sets[+el.dataset.set];if(!set)return;if(!set.done&&(!Number.isFinite(Number(set.reps))||Number(set.reps)<=0)){notify('Enter your reps before checking off the set');return}set.done=!set.done;save();render()}
else if(act==='add-set'){const ex=draft().exercises[+el.dataset.ex];if(ex.sets.length>=12){notify('12 sets per exercise maximum');return}ex.sets.push({weight:ex.sets.at(-1)?.weight??0,reps:'',done:false});save();render()}
else if(act==='remove-set'){const ex=draft().exercises[+el.dataset.ex];if(ex.sets.length>1){ex.sets.pop();save();render()}}
else if(act==='remove-ex'){const d=draft();if(d.exercises.length===1){notify('Keep at least one exercise');return}if(confirm('Remove this exercise from the current session?')){d.exercises.splice(+el.dataset.ex,1);save();render()}}
else if(act==='add-ex'){const name=prompt('Exercise name:');if(!name||!name.trim())return;const clean=name.trim().slice(0,65);const d=draft();d.exercises.push({id:'custom-'+Date.now(),name:clean,target:'8–12',unit:'kg',sets:[{weight:0,reps:'',done:false},{weight:0,reps:'',done:false}]});save();render()}
else if(act==='rest'){state.restEnd=Date.now()+Number(el.dataset.sec)*1000;save();updateRestBar();notify('Rest timer started')}
else if(act==='stop-rest'){state.restEnd=0;save();updateRestBar()}
else if(act==='finish'){const t=template(),d=draft(),s=statsOf(d);if(s.count===0)return;if(s.count<s.all&&!confirm(`${s.count} of ${s.all} sets completed. Save only completed sets?`))return;const exs=d.exercises.map(ex=>({...ex,sets:ex.sets.filter(x=>x.done)})).filter(ex=>ex.sets.length);state.history.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,6),templateId:t.id,name:t.name,started:d.started,ended:Date.now(),notes:d.notes,exercises:exs,setCount:s.count,volume:s.volume});delete state.drafts[t.id];state.tab='history';save();render();window.scrollTo({top:0,behavior:'smooth'});notify('Workout saved. Nice work!')}
else if(act==='delete-history'){if(confirm('Delete this workout from history?')){state.history=state.history.filter(x=>x.id!==el.dataset.id);save();render()}}
else if(act==='export'){const content=JSON.stringify({format:'rep-workout-tracker',version:1,exportedAt:new Date().toISOString(),data:state},null,2);const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='rep-workout-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Backup exported')}
else if(act==='import-click'){document.getElementById('importfile').click()}
else if(act==='reset'){if(confirm('Delete ALL workout history and in-progress data?')&&confirm('Final confirmation: reset everything?')){state=defaultState();save();render();notify('All local data reset')}}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&el.dataset.act!=='input')handleAction(el)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.act==='input'){const set=draft().exercises[+el.dataset.ex]?.sets[+el.dataset.set];if(!set)return;const value=el.value;if(el.dataset.field==='weight'){set.weight=value===''?'':Math.min(10000,Math.max(0,Number(value)||0))}else if(el.dataset.field==='reps'){set.reps=value===''?'':Math.min(100,Math.max(0,Math.floor(Number(value)||0)))}if(set.done){set.done=false;el.closest('.setrow')?.querySelector('.tick')?.classList.remove('checked')}save();const s=statsOf(draft());const bar=document.querySelector('.barfill');if(bar)bar.style.width=s.pct+'%';}else if(el.id==='notes'){draft().notes=el.value.slice(0,1000);save()}});
document.addEventListener('change',async e=>{if(e.target.id!=='importfile')return;const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const data=parsed?.format==='rep-workout-tracker'?parsed.data:parsed;if(!Array.isArray(data.history)||!data.drafts||typeof data.drafts!=='object')throw Error('Invalid backup');if(!confirm('Replace your current local workouts with the imported backup?'))return;state={...defaultState(),...data,tab:'history'};save();render();notify('Backup imported!')}catch(err){notify('Could not read this backup file')}finally{e.target.value=''}});
render();setInterval(updateRestBar,1000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
</body>
</html>
